services:
  - type: web
    name: velo-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: velo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: llm
        sync: false

databases:
  - name: velo-db
    databaseName: taskmanager
    user: taskuser
